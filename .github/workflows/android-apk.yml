name: APK Android

# O Actions da conta está travado por cobrança: com PR/push ele falhava em todo PR (check "apk" vermelho
# sem relação com o código). Agora só roda quando alguém o dispara (Actions > APK Android > Run workflow),
# depois que a cobrança for resolvida. O APK sai por `bash scripts/build-apk.sh` (Google Cloud Shell, grátis).
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build web (dist/)
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APKs (pagbank e tablet, debug)
        run: gradle -p android assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tchefood-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
